name: Build & Release

# Erzeugt bei jedem Push auf main ein Release v{n} (n zählt hoch) mit signierter APK.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9]+$' | sed 's/^v//' | sort -n | tail -n1 || true)
          [ -n "$latest" ] || latest=0
          next=$((latest + 1))
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "code=$next" >> "$GITHUB_OUTPUT"
          echo "Scheduling release v$next"

      - name: Write keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Using release signing key"
          else
            echo "No keystore secret - falling back to debug-signed release APK"
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease -PversionCode=${{ steps.version.outputs.code }} -PversionName=${{ steps.version.outputs.tag }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunslot-${{ steps.version.outputs.tag }}
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ steps.version.outputs.tag }} \
            --title "SunSlot ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            app/build/outputs/apk/release/app-release.apk
          echo "Release ${{ steps.version.outputs.tag }} created"